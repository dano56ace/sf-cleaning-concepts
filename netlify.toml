# Netlify Configuration for South Florida Cleaning Concepts
# Production: https://sfcleaningconcepts.com
# Staging: https://sf-cleaning-concepts.netlify.app

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# ==============================================================================
# 1. SECURITY & EDGE HEADERS
# ==============================================================================

# Global security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' data: https: blob:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none';"

# HTML Navigation & Root Caching: Always revalidate to prevent stale chunk errors
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker: Immediate update check, never cache long-term
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# PWA Web Manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Static SEO & Discovery Files
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Static Hashed Assets (JS, CSS, Media): Immutable 1-year cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# 2. CANONICAL 301 REDIRECTS (Domain Apex & HTTP -> HTTPS)
# ==============================================================================

[[redirects]]
  from = "https://www.sfcleaningconcepts.com/*"
  to = "https://sfcleaningconcepts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sfcleaningconcepts.com/*"
  to = "https://sfcleaningconcepts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sfcleaningconcepts.com/*"
  to = "https://sfcleaningconcepts.com/:splat"
  status = 301
  force = true

